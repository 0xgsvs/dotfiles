limit = 0

[ui]
theme = ""
auto_refresh_interval = 0
[ui.tracer]
enabled = false
[ui.colors]
"text" = { fg = "#505050" }
"selected" = { bg = "#333333" }
"border" = { fg = "#3A3A3A" }
"preview" = { fg = "#F0E6D2" }

[suggest]
[suggest.exec]
mode = "off"

[revisions]
log_batching = true
log_batch_size = 50
template = '''
if(self.root(),
  separate(" ",
    change_id.shortest(8),
    label("root", "root()"),
    commit_id.shortest(8),
    bookmarks,
  ) ++ "\n",
  label(
    separate(" ",
      if(current_working_copy, "working_copy"),
      if(immutable, "immutable", "mutable"),
      if(conflict, "conflicted"),
    ),
    concat(
      separate(" ",
        coalesce(
          if(hidden, label("hidden", change_id.shortest(8))),
          if(divergent, label("divergent", change_id.shortest(8))),
          change_id.shortest(8)
        ),
        truncate_end(12, author.email()),
        author.timestamp().local().format("%y/%m/%d %H:%M"),
        bookmarks,
        tags,
        working_copies,
        commit_id.shortest(8),
        coalesce(
          if(hidden, label("hidden", "(hidden)")),
          if(divergent, label("divergent", "(divergent)")),
        ),
        if(conflict, label("conflict", "(conflict)")),
        if(config("ui.show-cryptographic-signatures").as_boolean(),
          if(signature, 
            label("signature status", 
              surround("[", "]", 
                label(signature.status(), 
                  coalesce(
                    if(signature.status() == "good", "✓︎"),
                    if(signature.status() == "unknown", "?"),
                    "x"
                  )
                )
              )
            )
          )
        ),
      ) ++ "\n",
      separate(" ",
        if(empty, label("empty", "(empty)")),
        if(description,
          description.first_line(),
          label(if(empty, "empty"), label("description placeholder", "(no description set)")),
        ),
      ) ++ "\n",
    ),
  )
)
'''
# revset = "present(@) | ancestors(immutable_heads().., 20) | present(trunk())"
revset = "present(@) | ancestors(bookmarks() | tracked_remote_bookmarks() | immutable_heads().., 6) | present(trunk())"

[preview]
revision_command = ["show", "--color", "always", "-r", "$change_id"]
oplog_command = ["op", "show", "$operation_id", "--color", "always"]
file_command = ["difft", "--color", "always", "-r", "$change_id", "$file"]
position = "bottom"
show_at_start = false
width_percentage = 60.0
width_increment_percentage = 5.0

[oplog]
limit = 200

[git]
default_remote = "origin"

[ssh]
hijack_askpass = true
